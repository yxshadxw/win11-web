<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/shared/app.css">
  <script type="module" src="/shared/theme.js"></script>
  <title>고스톱</title>
  <style>
    body { display: flex; flex-direction: column; }
    #game { flex: 1; width: 100%; border: 0; display: block; }
    .offline { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
    .offline .card { max-width: 440px; }
    .offline h1 { font-size: 20px; font-weight: 600; margin: 8px 0; }
    .offline p { color: var(--text-2); line-height: 1.6; }
    .offline code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
    [hidden] { display: none !important; }
    progress { width: 100%; margin-top: 8px; }
    .addr { font-size: 12px; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="offline" class="offline" hidden>
    <div class="card">
      <div style="font-size:44px" aria-hidden="true">🎴</div>
      <h1 id="headline">고스톱 서버에 연결하는 중…</h1>
      <p id="detail"></p>
      <p class="addr">주소: <code id="target"></code></p>
      <progress id="wait" max="120" value="0" hidden></progress>
      <div class="row">
        <button id="retry" class="btn primary" type="button">다시 시도</button>
        <a id="direct" class="btn" target="_blank" rel="noopener">새 탭에서 열기</a>
      </div>
    </div>
  </div>
  <iframe id="game" title="고스톱" allow="autoplay; fullscreen; clipboard-write" hidden></iframe>

  <script type="module">
    const $ = (s) => document.querySelector(s);
    const offline = $('#offline');
    const frame = $('#game');
    const MESSAGES = {
      'not-configured': ['화투클럽 주소가 설정되지 않았어요', 'Render 대시보드의 win11-web 서비스 → Environment에서 GOSTOP_URL에 배포된 화투클럽 주소(https://…)를 넣고 다시 배포하세요.'],
      starting: ['화투클럽 서버를 깨우는 중…', 'Render 무료 서버는 한동안 쓰지 않으면 잠듭니다. 깨어나는 데 1분 정도 걸릴 수 있어요. 자동으로 다시 확인합니다.'],
      timeout: ['화투클럽 서버를 깨우는 중…', '응답이 늦습니다. 서버가 깨어나는 중일 수 있어 자동으로 다시 확인합니다.'],
      unreachable: ['화투클럽 서버에 연결할 수 없어요', '주소가 맞는지, 화투클럽 서비스가 배포되어 있는지 확인하세요. 로컬에서는 gostop-next 폴더에서 npm.cmd run dev를 실행하세요.'],
      'frame-blocked': ['이 창 안에서는 열 수 없어요', '화투클럽 서버가 다른 사이트 안에 표시되는 것을 막고 있습니다(X-Frame-Options 또는 CSP frame-ancestors). 새 탭에서 열거나, 화투클럽 쪽에서 이 사이트를 허용하세요.'],
      mixed: ['보안 연결이 필요해요', '이 사이트는 https인데 화투클럽 주소가 http라서 브라우저가 막습니다. GOSTOP_URL을 https 주소로 바꾸세요.'],
    };
    let waited = 0;
    let timer = 0;

    function show(reason, url) {
      const [title, detail] = MESSAGES[reason] || MESSAGES.unreachable;
      $('#headline').textContent = title;
      $('#detail').textContent = detail;
      $('#target').textContent = url || '';
      $('#direct').href = url || '#';
      $('#wait').hidden = !(reason === 'starting' || reason === 'timeout');
      $('#wait').value = waited;
      frame.hidden = true;
      offline.hidden = false;
    }

    async function status() {
      try {
        const res = await fetch('/api/gostop/status', { cache: 'no-store' });
        if (res.ok) return await res.json();
      } catch { /* fall through */ }
      return { reason: 'unreachable', url: '' };
    }

    async function connect() {
      clearTimeout(timer);
      show('starting', $('#target').textContent);
      $('#headline').textContent = '고스톱 서버에 연결하는 중…';
      const s = await status();
      let url = s.url;
      if (location.protocol === 'https:' && /^http:\/\//.test(url || '') && !/localhost|127\.0\.0\.1/.test(url)) {
        return show('mixed', url);
      }
      if (s.reason === 'ok') {
        offline.hidden = true;
        frame.hidden = false;
        if (frame.src !== url) frame.src = url;
        return;
      }
      show(s.reason, url);
      if ((s.reason === 'starting' || s.reason === 'timeout') && waited < 120) {
        timer = setTimeout(() => { waited += 5; connect(); }, 5000);
      }
    }

    $('#retry').addEventListener('click', () => { waited = 0; connect(); });
    connect();
  </script>
</body>
</html>
