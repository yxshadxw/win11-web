<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shared/app.css">
<script type="module" src="/shared/theme.js"></script>
<link rel="stylesheet" href="app.css">
<title>웹카트</title>
</head>
<body>
<main class="app">
<header class="toolbar command-bar">
  <div class="brand"><span class="brand-icon">W</span><strong>웹카트</strong><span class="brand-sub">서킷 레이싱</span></div>
  <div class="commands">
    <button class="btn" id="sound" aria-label="소리 끄기" title="소리 끄기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12-1a5 5 0 0 1 0 8m2-11a9 9 0 0 1 0 14"/></svg><span>소리</span></button>
    <button class="btn" id="pause" title="일시 정지 (Esc 또는 P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span>일시 정지</span></button>
    <button class="btn" id="restart" title="다시 시작"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v5h5M5 9a8 8 0 1 1-1 5"/></svg><span>다시 시작</span></button>
  </div>
</header>
<section class="stage" aria-label="레이스 화면">
  <canvas id="game" aria-label="위에서 내려다보는 카트 경주 화면"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="hud-card place"><span>현재 순위</span><strong id="position">1<small> / 4</small></strong></div>
    <div class="hud-card"><span>랩</span><strong id="lap">1 / 3</strong></div>
    <div class="hud-card times"><span>현재 랩 <b id="lap-time">00:00.000</b></span><span>최고 기록 <b id="best-time">--:--.---</b></span></div>
    <div class="hud-card boost-card"><span>드리프트 충전 <b id="boost-label">0단계</b></span><div class="boost-meter"><i id="boost-fill"></i></div></div>
  </div>
  <div class="lights" id="lights" hidden aria-live="polite"><div class="light-row"><i></i><i></i><i></i></div><strong id="light-text">준비</strong></div>
  <div class="touch-controls" id="touch-controls" hidden aria-label="터치 조작">
    <div class="touch-group"><button data-control="left" aria-label="왼쪽">◀</button><button data-control="right" aria-label="오른쪽">▶</button></div>
    <div class="touch-group"><button data-control="drift" class="drift-button">드리프트</button><button data-control="down" aria-label="브레이크">▼</button><button data-control="up" aria-label="가속">▲</button></div>
  </div>
  <div class="overlay" id="overlay">
    <section class="panel card" id="title-panel" aria-labelledby="title-heading">
      <div class="eyebrow">ORIGINAL CIRCUIT RACING</div><h1 id="title-heading">웹카트</h1>
      <p class="intro">나만의 라인을 찾아, 세 바퀴를 질주하세요.</p>
      <div class="section-label">서킷 선택 <span>3 LAPS · 4 RACERS</span></div>
      <div class="track-options">
        <button class="track-option selected" data-track="meadow" aria-pressed="true"><span class="track-art meadow">⌁</span><span><strong>초록 바람 서킷</strong><small>완만한 코너와 넓은 잔디</small></span><span class="check">✓</span></button>
        <button class="track-option" data-track="harbor" aria-pressed="false"><span class="track-art harbor">⌁</span><span><strong>노을 항구 서킷</strong><small>연속 코너와 긴 직선</small></span><span class="check">✓</span></button>
      </div>
      <div class="help"><strong>조작 방법</strong><span>방향키 / WASD 가속·조향</span><span>Shift / Space 드리프트 · 놓으면 부스트</span><span>Esc / P 일시 정지</span></div>
      <button class="btn primary start-button" id="start">레이스 시작 <span>→</span></button>
    </section>
    <section class="panel card compact" id="pause-panel" hidden><div class="eyebrow">RACE PAUSED</div><h2>일시 정지</h2><p>잠시 쉬어 가세요.</p><div class="panel-actions"><button class="btn primary" id="resume">계속하기</button><button class="btn" id="pause-restart">다시 시작</button><button class="btn" id="pause-title">서킷 선택</button></div></section>
    <section class="panel card compact" id="result-panel" hidden><div class="eyebrow">RACE COMPLETE</div><h2>레이스 결과</h2><p id="result-subtitle"></p><div class="result-list" id="results"></div><div class="panel-actions"><button class="btn primary" id="race-again">다시 달리기</button><button class="btn" id="result-title">서킷 선택</button></div></section>
  </div>
</section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
