<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아이콘 미리보기</title>
  <link rel="stylesheet" href="../shared/app.css">
  <script type="module" src="../shared/theme.js"></script>
  <style>
    body { height: auto; min-height: 100%; }
    main { max-width: 1200px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: var(--text-2); margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .item { overflow: hidden; padding: 0; }
    .name { padding: 12px 16px; font-weight: 600; }
    .samples { display: grid; grid-template-columns: 1fr 1fr; }
    .surface { display: flex; align-items: end; justify-content: space-evenly; gap: 8px; padding: 16px 8px; }
    .light { background: #f3f3f3; color: #333; }
    .dark { background: #202020; color: #eee; }
    .sample { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; }
    .sample img { display: block; }
    @media (max-width: 400px) { main { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>아이콘 미리보기</h1>
    <p>밝은 배경과 어두운 배경에서 크기별로 비교합니다.</p>
    <div class="grid" id="icons"></div>
  </main>
  <script>
    const icons = [
      'explorer', 'chrome', 'notepad', 'calculator', 'paint', 'settings',
      'webkart', 'gostop', 'snake', 'breakout', 'memory', 'terminal',
      'photos', 'shooter', 'typing', 'start', 'search', 'folder',
      'file-text', 'file-image', 'recycle'
    ];
    const grid = document.getElementById('icons');

    for (const name of icons) {
      const item = document.createElement('section');
      item.className = 'card item';
      const heading = document.createElement('div');
      heading.className = 'name';
      heading.textContent = name;
      item.append(heading);

      const samples = document.createElement('div');
      samples.className = 'samples';
      for (const background of ['light', 'dark']) {
        const surface = document.createElement('div');
        surface.className = `surface ${background}`;
        surface.setAttribute('aria-label', background === 'light' ? '밝은 배경' : '어두운 배경');
        for (const size of [24, 32, 48]) {
          const sample = document.createElement('div');
          sample.className = 'sample';
          const image = document.createElement('img');
          image.src = `${name}.svg`;
          image.width = size;
          image.height = size;
          image.alt = '';
          const label = document.createElement('span');
          label.textContent = size;
          sample.append(image, label);
          surface.append(sample);
        }
        samples.append(surface);
      }
      item.append(samples);
      grid.append(item);
    }
  </script>
</body>
</html>
