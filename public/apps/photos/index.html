<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/shared/app.css">
  <script type="module" src="/shared/theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <title>사진</title>
</head>
<body>
  <header class="toolbar"><strong class="brand">▧ <span>사진</span></strong><span class="spacer"></span><a class="btn" href="/apps/paint/">그림판 열기</a></header>
  <main id="gallery"><div class="heading"><h1>갤러리</h1><p>가상 파일의 사진을 둘러보세요.</p></div><div id="groups"></div><div id="empty" class="empty" hidden><div class="empty-icon">▧</div><h2>사진이 없습니다</h2><p>그림판에서 새로운 그림을 만들어 보세요.</p><a class="btn primary" href="/apps/paint/">그림판 열기</a></div></main>
  <section id="viewer" hidden aria-label="사진 뷰어">
    <div class="toolbar viewer-toolbar"><button class="btn" id="back" aria-label="갤러리로 돌아가기">←</button><strong id="filename"></strong><span class="spacer"></span><button class="btn" id="zoom-out" aria-label="축소">−</button><span id="zoom-label">100%</span><button class="btn" id="zoom-in" aria-label="확대">＋</button><button class="btn" id="fit">맞춤</button><button class="btn" id="rotate" aria-label="회전">↻</button><a class="btn" id="edit">그림판에서 편집</a><button class="btn" id="delete" aria-label="삭제">⌫</button></div>
    <div id="stage" tabindex="0" aria-label="사진 영역. 드래그하여 이동하고 휠로 확대 또는 축소"><img id="image" alt=""><button class="nav previous" aria-label="이전 사진">‹</button><button class="nav next" aria-label="다음 사진">›</button></div>
  </section>
  <dialog id="confirm"><h2>사진을 삭제하시겠습니까?</h2><p id="confirm-name"></p><p>이 작업은 되돌릴 수 없습니다.</p><div class="actions"><button class="btn" id="cancel">취소</button><button class="btn primary" id="confirm-delete">삭제</button></div></dialog>
  <dialog id="error"><h2>사진</h2><p id="error-message"></p><div class="actions"><button class="btn primary" id="error-close">확인</button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
