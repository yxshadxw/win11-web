name: Keep warm

# Render's free instances sleep after 15 idle minutes; a ping every 10 minutes keeps the
# first visit fast. One always-on free service fits in Render's 750 free hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://win11-web-64by.onrender.com/healthz
      # The hwatu-club (gostop) service sleeps too; set the repository variable GOSTOP_URL
      # (Settings → Secrets and variables → Actions → Variables) to keep it awake as well.
      # Two always-on free services need more than the 750 free hours, so one should be paid.
      - if: ${{ vars.GOSTOP_URL != '' }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null "${{ vars.GOSTOP_URL }}"
