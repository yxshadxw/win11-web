<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/shared/app.css">
  <script type="module" src="/shared/theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <title>시계</title>
</head>
<body>
  <div class="app"><nav aria-label="시계 메뉴"><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><span>시계</span></div><button class="nav active" data-page="timer"><span>◷</span> 타이머</button><button class="nav" data-page="alarm"><span>♧</span> 알람</button><button class="nav" data-page="stopwatch"><span>◴</span> 스톱워치</button><button class="nav" data-page="world"><span>◎</span> 세계 시계</button></nav><main><section id="timer" class="page"><header><div><span class="eyebrow">시간에 집중하세요</span><h1>타이머</h1></div><button class="btn primary" id="new-timer">＋ 타이머 추가</button></header><div class="presets"><span>빠른 시작</span><button class="btn" data-preset="60">1분</button><button class="btn" data-preset="300">5분</button><button class="btn" data-preset="600">10분</button><button class="btn" data-preset="1500">25분</button></div><div id="timers" class="grid"></div></section><section id="alarm" class="page" hidden><header><div><span class="eyebrow">중요한 순간을 놓치지 마세요</span><h1>알람</h1></div><button class="btn primary" id="new-alarm">＋ 알람 추가</button></header><p class="hint">알람은 이 사이트가 열려 있을 때만 울립니다.</p><div id="alarms" class="grid"></div></section><section id="stopwatch" class="page" hidden><header><div><span class="eyebrow">순간을 기록하세요</span><h1>스톱워치</h1></div></header><div class="stopwatch card"><div id="stop-time">00:00:00.00</div><div class="controls"><button class="btn primary" id="stop-toggle">시작</button><button class="btn" id="lap">랩</button><button class="btn" id="stop-reset">초기화</button></div><div id="laps"></div></div></section><section id="world" class="page" hidden><header><div><span class="eyebrow">전 세계의 지금</span><h1>세계 시계</h1></div><button class="btn primary" id="new-city">＋ 도시 추가</button></header><div id="cities" class="grid"></div></section></main></div>
  <dialog id="timer-dialog"><form id="timer-form"><h2>타이머 추가</h2><label>이름<input class="input" name="label" maxlength="40" placeholder="타이머"></label><div class="row"><label>시간<input class="input" name="hours" type="number" min="0" max="23" value="0"></label><label>분<input class="input" name="minutes" type="number" min="0" max="59" value="5"></label><label>초<input class="input" name="seconds" type="number" min="0" max="59" value="0"></label></div><p id="timer-error" class="error"></p><div class="actions"><button type="button" class="btn close">취소</button><button class="btn primary">저장</button></div></form></dialog>
  <dialog id="alarm-dialog"><form id="alarm-form"><h2>알람 추가</h2><label>시간<input class="input" name="time" type="time" required value="08:00"></label><label>이름<input class="input" name="label" maxlength="40" placeholder="알람"></label><fieldset><legend>반복 요일 <small>(선택하지 않으면 한 번)</small></legend><div class="days"><label><input type="checkbox" name="day" value="0">일</label><label><input type="checkbox" name="day" value="1">월</label><label><input type="checkbox" name="day" value="2">화</label><label><input type="checkbox" name="day" value="3">수</label><label><input type="checkbox" name="day" value="4">목</label><label><input type="checkbox" name="day" value="5">금</label><label><input type="checkbox" name="day" value="6">토</label></div></fieldset><div class="actions"><button type="button" class="btn close">취소</button><button class="btn primary">저장</button></div></form></dialog>
  <dialog id="city-dialog"><form id="city-form"><h2>도시 추가</h2><label>도시<select class="input" name="city" id="city-select"></select></label><div class="actions"><button type="button" class="btn close">취소</button><button class="btn primary">추가</button></div></form></dialog>
  <dialog id="ring-dialog"><h2 id="ring-title">알림</h2><p id="ring-body"></p><div class="actions"><button class="btn" id="snooze">5분 후 다시 알림</button><button class="btn primary" id="dismiss">닫기</button></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
